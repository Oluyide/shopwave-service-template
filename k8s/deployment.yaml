apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopwave-service
  labels:
    app: shopwave-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopwave-service
  template:
    metadata:
      labels:
        app: shopwave-service
    spec:
      containers:
        - name: app
          image: ghcr.io/shopwave/shopwave-service:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
